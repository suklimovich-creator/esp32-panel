<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Панель</title>
<style>
:root{--bg:#0e0f13;--card:#181a21;--line:#2a2d36;--text:#eceef2;--dim:#8b90a0;--acc:#ffb547;--ok:#34c759;--bad:#ff5a5f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;font-weight:600;margin:4px 0 2px}
.sub{color:var(--dim);margin-bottom:16px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
h2{font-size:15px;font-weight:600;margin:0 0 10px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
dt{color:var(--dim)}dd{margin:0;word-break:break-all}
label{display:block;color:var(--dim);font-size:13px;margin:10px 0 4px}
input,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#101218;color:var(--text);font:inherit}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
button{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:#222530;color:var(--text);font:inherit;cursor:pointer}
button.main{background:var(--acc);border-color:var(--acc);color:#1a1205;font-weight:600}
button:disabled{opacity:.5}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.msg{margin-top:10px;min-height:1.2em;color:var(--dim)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
progress{width:100%;height:8px;margin-top:10px;accent-color:var(--acc)}
textarea{width:100%;min-height:260px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#101218;color:var(--text);font:12px/1.45 ui-monospace,Consolas,monospace;resize:vertical}
</style>
</head>
<body>
<main>
<h1 id="title">Панель</h1>
<div class="sub" id="sub">…</div>

<section>
<h2>Состояние</h2>
<dl id="st"></dl>
</section>

<section>
<h2>Wi-Fi</h2>
<label for="ssid">Сеть</label>
<div class="row"><select id="ssidsel"><option value="">— выберите или введите ниже —</option></select><button id="scan" style="flex:0 0 auto">Найти</button></div>
<input id="ssid" placeholder="имя сети (2,4 ГГц)" style="margin-top:8px" autocomplete="off">
<label for="pass">Пароль</label>
<input id="pass" type="password" placeholder="оставьте пустым, чтобы не менять" autocomplete="new-password">
<label for="name">Имя экрана в сети</label>
<input id="name">
<label for="fw">Папка с прошивками на сервере</label>
<input id="fw" placeholder="http://192.168.1.77/panel/fw/">
<label for="mqtt">Брокер MQTT</label>
<input id="mqtt" placeholder="mqtt://192.168.1.77:1883">
<div class="btns"><button class="main" id="save">Сохранить и перезагрузить</button></div>
<div class="msg" id="smsg"></div>
</section>

<section>
<h2>Раскладка панели</h2>
<div id="lsrc" class="msg" style="margin:0 0 8px"></div>
<textarea id="layout" spellcheck="false"></textarea>
<div class="btns">
<button class="main" id="lsave">Сохранить</button>
<button id="lfile">Из файла…</button>
<button id="ldown">Скачать</button>
<button id="lreset">Вернуть встроенную</button>
</div>
<input id="lpick" type="file" accept=".json,application/json" hidden>
<div class="msg" id="lmsg"></div>
</section>

<section>
<h2>Прошивка</h2>
<dl><dt>Версия</dt><dd id="ver">…</dd><dt>Обновление</dt><dd id="ota">…</dd></dl>
<div class="btns"><button id="check">Проверить сервер</button></div>
<label for="file">Или загрузить файл esp32-panel.bin</label>
<input id="file" type="file" accept=".bin">
<div class="btns"><button class="main" id="upload">Загрузить</button></div>
<progress id="prog" max="100" value="0" hidden></progress>
<div class="msg" id="umsg"></div>
</section>

<section>
<div class="btns" style="margin:0"><button id="reboot">Перезагрузить экран</button></div>
</section>
</main>
<script>
const $ = id => document.getElementById(id);
let filled = false;

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function say(el, text, cls){el.textContent = text; el.className = 'msg ' + (cls||'');}
function ago(s){ if(s < 60) return s + ' с'; if(s < 3600) return Math.floor(s/60) + ' мин';
  if(s < 86400) return Math.floor(s/3600) + ' ч ' + Math.floor(s%3600/60) + ' мин'; return Math.floor(s/86400) + ' дн'; }

async function loadLayout(){
  try{
    const r = await fetch('/api/layout');
    const txt = await r.text();
    try{ $('layout').value = JSON.stringify(JSON.parse(txt), null, 2); }catch(e){ $('layout').value = txt; }
    $('lsrc').textContent = r.headers.get('X-Layout-Source') === 'custom' ? 'Загруженная раскладка' : 'Встроенная раскладка (по умолчанию)';
  }catch(e){ $('lsrc').textContent = 'не удалось получить раскладку'; }
}
$('lsave').onclick = async () => {
  let body = $('layout').value;
  try{ body = JSON.stringify(JSON.parse(body)); }catch(e){ say($('lmsg'), 'ошибка в JSON: ' + e.message, 'bad'); return; }
  const r = await (await fetch('/api/layout', {method:'POST', headers:{'Content-Type':'application/json'}, body})).json();
  say($('lmsg'), r.message, r.ok ? 'ok' : 'bad');
};
$('lfile').onclick = () => $('lpick').click();
$('lpick').onchange = e => { const f = e.target.files[0]; if(!f) return;
  f.text().then(t => { $('layout').value = t; say($('lmsg'), 'файл загружен в поле - проверьте и нажмите «Сохранить»'); }); };
$('ldown').onclick = () => { const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([$('layout').value], {type:'application/json'}));
  a.download = ($('title').textContent || 'panel') + '-layout.json'; a.click(); };
$('lreset').onclick = async () => {
  if(!confirm('Вернуть встроенную раскладку?')) return;
  const r = await (await fetch('/api/layout/reset', {method:'POST'})).json();
  say($('lmsg'), r.message, r.ok ? 'ok' : 'bad');
};

async function load(){
  try{
    const s = await (await fetch('/api/status')).json();
    $('title').textContent = s.name;
    $('sub').textContent = s.connected ? 'в сети ' + s.ssid + ' · ' + s.ip : (s.ap ? 'точка доступа ' + s.ap_ssid : 'нет сети');
    const up = s.uptime_s, h = Math.floor(up/3600), m = Math.floor(up%3600/60);
    const rows = [
      ['Wi-Fi', s.connected ? esc(s.ssid) + ', ' + s.rssi + ' дБм, в сети ' + ago(s.wifi_online_s) : (s.ssid ? 'нет связи с ' + esc(s.ssid) : 'не настроен')],
      ['Обрывы Wi-Fi', s.wifi_drops ? s.wifi_drops + ', последний ' + ago(s.wifi_last_drop_ago_s) + ' назад: ' + esc(s.wifi_last_reason) : 'не было'],
      ['MQTT', s.mqtt_ok ? 'подключён, плиток ' + s.tiles : 'нет связи с брокером'],
      ['Адрес', s.ip || '—'],
      ['Работает', h + ' ч ' + m + ' мин'],
      ['Память', s.heap_kb + ' КБ (минимум ' + s.heap_min_kb + '), PSRAM ' + s.psram_kb + ' КБ'],
      ['Слот', esc(s.partition)],
    ];
    $('st').innerHTML = rows.map(r => '<dt>' + r[0] + '</dt><dd>' + r[1] + '</dd>').join('');
    $('ver').textContent = s.version + ' (' + s.built + ', IDF ' + s.idf + ')';
    $('ota').textContent = s.ota;
    if(!filled){
      $('ssid').value = s.ssid; $('name').value = s.name;
      $('fw').value = s.fw_url; $('mqtt').value = s.mqtt;
      filled = true;
    }
  }catch(e){ $('sub').textContent = 'экран не отвечает'; }
}

$('scan').onclick = async () => {
  const b = $('scan'); b.disabled = true; b.textContent = '…';
  try{
    const list = await (await fetch('/api/scan')).json();
    const sel = $('ssidsel');
    sel.innerHTML = '<option value="">— найдено сетей: ' + list.length + ' —</option>' +
      list.sort((a,b)=>b.rssi-a.rssi).map(n => '<option>' + esc(n.ssid) + '</option>').join('');
  }catch(e){}
  b.disabled = false; b.textContent = 'Найти';
};
$('ssidsel').onchange = e => { if(e.target.value) $('ssid').value = e.target.value; };

$('save').onclick = async () => {
  const body = {ssid: $('ssid').value.trim(), pass: $('pass').value, name: $('name').value.trim(),
                fw_url: $('fw').value.trim(), mqtt: $('mqtt').value.trim()};
  try{
    const r = await (await fetch('/api/settings', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)})).json();
    say($('smsg'), r.message + (r.ok && body.ssid ? '. Экран подключится к «' + body.ssid + '»; новая страница будет по его адресу в этой сети.' : ''), r.ok ? 'ok' : 'bad');
  }catch(e){ say($('smsg'), 'не удалось сохранить', 'bad'); }
};

$('check').onclick = async () => {
  await fetch('/api/ota/check', {method:'POST'});
  say($('umsg'), 'проверяю сервер…');
  setTimeout(load, 3000);
};

$('upload').onclick = () => {
  const f = $('file').files[0];
  if(!f){ say($('umsg'), 'выберите файл', 'bad'); return; }
  const x = new XMLHttpRequest();
  $('prog').hidden = false; $('upload').disabled = true;
  x.upload.onprogress = e => { if(e.lengthComputable) $('prog').value = e.loaded * 100 / e.total; };
  x.onload = () => {
    let r = {}; try{ r = JSON.parse(x.responseText); }catch(e){}
    say($('umsg'), r.message || 'ошибка', r.ok ? 'ok' : 'bad');
    $('upload').disabled = false;
    if(r.ok) setTimeout(() => location.reload(), 15000);
  };
  x.onerror = () => { say($('umsg'), 'загрузка прервалась', 'bad'); $('upload').disabled = false; };
  x.open('POST', '/api/update');
  x.setRequestHeader('Content-Type', 'application/octet-stream');
  x.send(f);
};

$('reboot').onclick = async () => {
  if(!confirm('Перезагрузить экран?')) return;
  await fetch('/api/reboot', {method:'POST'});
  say($('umsg'), 'перезагрузка…');
};

load(); loadLayout(); setInterval(load, 5000);
</script>
</body>
</html>
